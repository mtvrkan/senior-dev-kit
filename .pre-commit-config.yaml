# Pre-commit hooks for the senior-dev-kit repo itself.
# Install: pip install pre-commit && pre-commit install
# Run all: pre-commit run --all-files
# Update pins: pre-commit autoupdate --freeze
#
# These hooks keep the kit's own source clean (repo dev tooling — not for consumers).
# For a TEMPLATE to copy into projects that USE the kit, see:
#   - security/.pre-commit-config.yaml (secret scanning + Dockerfile/Python hooks)
#   - security/Dockerfile.template
#   - the pre-commit stack in rules/000-security.md

repos:
  # General hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]
      - id: check-merge-conflict
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext, md]
      - id: end-of-file-fixer
      - id: check-yaml
        files: \.(yml|yaml)$
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb, 500]

  # Secret scanning — full git history on first run
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.26.0
    hooks:
      - id: gitleaks

  # Markdown lint — matches CI config in .markdownlint.json
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.17.2
    hooks:
      - id: markdownlint-cli2
        args: ["--config", ".markdownlint.json"]
        types: [markdown]

  # Shell script lint (install.sh)
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: \.sh$
        args: [--severity=warning]

  # Skill frontmatter validation (local — requires node >=22.6)
  - repo: local
    hooks:
      - id: validate-skills
        name: Validate skill frontmatter
        language: node
        entry: node --experimental-strip-types scripts/validate-skills.ts
        pass_filenames: false
        always_run: true
        additional_dependencies: []
