name: Dependency Audit

on:
  push:
    branches: [main, master]
    paths:
      - 'package*.json'
      - 'yarn.lock'
      - 'pnpm-lock.yaml'
      - 'bun.lockb'
      - 'requirements*.txt'
      - 'Pipfile*'
      - 'poetry.lock'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'go.sum'
      - 'Cargo.lock'
      - 'Gemfile.lock'
      - 'composer.lock'
  pull_request:
    paths:
      - 'package*.json'
      - 'yarn.lock'
      - 'pnpm-lock.yaml'
      - 'bun.lockb'
      - 'requirements*.txt'
      - 'Pipfile*'
      - 'poetry.lock'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'go.sum'
      - 'Cargo.lock'
      - 'Gemfile.lock'
      - 'composer.lock'
  schedule:
    - cron: '0 9 * * 1'  # weekly on Monday 9am UTC

permissions:
  contents: read
  security-events: write

jobs:
  # hashFiles() cannot gate a job-level `if:` — it is evaluated against the
  # runner's workspace before checkout, so it always returns '' and every
  # gated job would be silently skipped. This job does a real checkout,
  # detects which ecosystems exist, and the audit jobs gate on its outputs.
  detect:
    name: Detect Ecosystems
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.files.outputs.node }}
      python: ${{ steps.files.outputs.python }}
      go: ${{ steps.files.outputs.go }}
      rust: ${{ steps.files.outputs.rust }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Detect manifest files
        id: files
        run: |
          set -euo pipefail
          exists_any() {
            for pattern in "$@"; do
              if compgen -G "$pattern" > /dev/null; then echo true; return; fi
            done
            echo false
          }
          {
            echo "node=$(exists_any 'package.json')"
            echo "python=$(exists_any 'requirements*.txt' 'pyproject.toml' 'Pipfile' 'uv.lock')"
            echo "go=$(exists_any 'go.sum')"
            echo "rust=$(exists_any 'Cargo.lock')"
          } >> "$GITHUB_OUTPUT"

  audit-node:
    name: Node.js Audit
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.node == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e  # v4.3.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: npm audit (moderate+)
        run: npm audit --audit-level=moderate

  audit-python:
    name: Python Audit
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.python == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit==2.7.3

      - name: pip-audit (auto-detects requirements.txt, pyproject.toml, uv.lock)
        run: pip-audit

  audit-go:
    name: Go Audit
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.go == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-go@d60b41a563a30eb0109d3a2e3f40b9d06b36f054  # v5.4.0
        with:
          go-version: '1.23'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.3

      - name: govulncheck
        run: govulncheck ./...

  audit-rust:
    name: Rust Audit
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.21.0 --locked

      - name: cargo audit
        run: cargo audit

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.node == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e  # v4.3.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Check licenses
        run: |
          npx license-checker --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;CC0-1.0;Python-2.0;Unlicense" \
            --excludePrivatePackages \
            --summary
        # Fails if any package uses a license not in the allowlist
        # Add GPL-3.0 to the list only if your project is also GPL
