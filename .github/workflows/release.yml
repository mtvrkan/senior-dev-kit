name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Extract changelog entry
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v heading="## [${VERSION}]" '
            index($0, heading) == 1 { found=1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > release-notes.txt
          if [ ! -s release-notes.txt ]; then
            echo "No CHANGELOG.md entry found for [${VERSION}] — add one before tagging a release." >&2
            exit 1
          fi
          echo "Done — $(wc -l < release-notes.txt) lines extracted."

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Senior Dev Kit ${GITHUB_REF_NAME}" \
            --notes-file release-notes.txt
