# GitHub Pages (Jekyll) — zero-build docs site straight from the repo markdown.
# Enable: repo Settings → Pages → Source: "Deploy from a branch" → main / (root).
# Every .md renders at its path (README.md → site root, SETUP.md → /SETUP, …).
title: Senior Dev Kit
description: Agent, skill and rule kit that gives Claude Code senior engineering team behavior.
theme: jekyll-theme-cayman
markdown: kramdown

# Keep tooling and machine-only files out of the rendered site.
exclude:
  - node_modules/
  - scripts/
  - eval/
  - hooks/hooks.json
  - package.json
  - package-lock.json
  - tsconfig.json
  - eslint.config.js
  - settings-template.json
  - .claude/
  - .claude-plugin/
